<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Shopping List</title>
		<link rel="stylesheet" href="style.css" />
		<script src="main.js" defer></script>
	</head>
	<body>
		<header>
			<nav>
				<a href="#github">GitHub</a>
				<ul>
					<li><a href="#one">One</a></li>
					<li><a href="#two">Two</a></li>
					<li><a href="#three">Three</a></li>
				</ul>
			</nav>
			<h1>Shopping List</h1>
		</header>
		<main>
			<fieldset class="inputArea">
				<h2>Looking to protect yourself, or deal some damage?</h2>
				<div>
					<label>
						Food Item:
						<input
							id="food-input"
							type="text"
							placeholder="Only include tasty food!"
					/></label>
					<button id="food-butt">Add to List</button>
				</div>
				<div>
					<label>
						Non-Food Items:<input
							id="non-input"
							type="text"
							placeholder="Soap, paper products, etc"
					/></label>
					<button id="non-butt">Add to List</button>
				</div>
				<button id="remove">Removed checked items</button>
			</fieldset>
			<fieldset class="food-list">
				<legend>Tasty Food Items:</legend>
			</fieldset>
			<fieldset class="non-list">
				<legend>Non-Food Items:</legend>
			</fieldset>
		</main>
	</body>
</html>
